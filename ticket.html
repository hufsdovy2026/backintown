<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BACK IN TOWN Ticket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #12100e;
      color: #e7e1d6;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 54px 22px 70px;
    }

    /* =========================
       HEADER
    ========================= */

    .ticket-header {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      margin-bottom: 42px;
    }

    .poster-placeholder {
      width: 145px;
      aspect-ratio: 3 / 4;
      display: block;
      flex-shrink: 0;
      object-fit: cover;
      border: none;

      box-shadow:
        0 12px 32px
        rgba(0, 0, 0, 0.3);
    }

    .header-text {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
    }

    .ticket-title {
      margin: 0;
      color: #eee8dc;

      font-size: 44px;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .ticket-description {
      margin: 18px 0 0;
      color: #9d978d;

      font-size: 12px;
      font-weight: 500;
      line-height: 1.7;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      padding: 24px 0;
      border-top: 1px solid #39342e;

      color: #918b81;

      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       TICKET
    ========================= */

    #ticket {
      border-top: 1px solid #39342e;
    }

    /* =========================
       COMMON 2-COLUMN AXIS
    ========================= */

    .ticket-top,
    .info-pair {
      display: grid;

      /*
        왼쪽보다 오른쪽 열을 조금 넓게.
        두 영역이 완전히 같은 축을 공유함.
      */
      grid-template-columns:
        minmax(0, 47fr)
        minmax(0, 53fr);

      column-gap: 10px;
      width: 100%;
    }

    /* =========================
       RESERVATION / STATUS
    ========================= */

    .ticket-top {
      padding: 28px 0 26px;
      border-bottom: 1px solid #39342e;
    }

    .ticket-top-column {
      min-width: 0;
      text-align: left;
    }

    .ticket-label {
      display: block;

      margin-bottom: 9px;

      color: #9a3c38;

      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.12em;

      text-align: left;
    }

    #reservation-number {
      display: block;

      color: #eee8dc;

      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.04em;

      white-space: nowrap;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: inline-flex;

      width: auto;

      align-items: center;
      justify-content: center;

      padding: 9px 14px;

      border: 1px solid #454039;
      border-radius: 999px;

      background: #191612;
      color: #e7e1d6;

      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;

      white-space: nowrap;
    }

    #status.status-pending {
      border-color: #575149;
      background: #292622;
      color: #d3ccc1;
    }

    #status.status-confirmed {
      border-color: #2f6fed;
      background: #2f6fed;
      color: #ffffff;
    }

    #status.status-cancelled {
      border-color: #d64545;
      background: #d64545;
      color: #ffffff;
    }

    /* =========================
       INFO
    ========================= */

    .ticket-info {
      padding: 20px 0 22px;
      border-bottom: 1px solid #39342e;
    }

    .info-pair {
      align-items: flex-start;
      padding: 13px 0;
    }

    .info-item {
      min-width: 0;
      text-align: left;
    }

    /* =========================
       LABEL
    ========================= */

    .info-label {
      display: block;

      width: 100%;
      margin-bottom: 7px;

      color: #827b72;

      text-align: left;

      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* =========================
       6개 핵심 정보
    ========================= */

    .info-value {
      display: block;

      width: 100%;

      color: #eee8dc;

      text-align: left;

      font-size: 20px;
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: -0.06em;
    }

    /* =========================
       DATE
    ========================= */

    .date-main {
      display: block;

      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      white-space: nowrap;
    }

    .date-time {
      display: block;

      margin-top: 3px;

      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;
    }

    /* =========================
       VENUE
    ========================= */

    .venue-name {
      display: block;

      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      white-space: nowrap;
    }

    .venue-address {
      display: block;

      margin-top: 4px;

      color: #827b72;

      text-align: left;

      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.065em;

      white-space: nowrap;
    }

    /* =========================
       PAYMENT
    ========================= */

    #payment-info {
      display: none;

      margin: 8px 0 24px;
      padding: 18px;

      border: 1px solid #39342e;
      border-radius: 4px;

      background: #191612;
    }

    .payment-label {
      margin-bottom: 8px;

      color: #918b81;

      font-size: 11px;
      font-weight: 600;
    }

    .payment-account {
      color: #eee8dc;

      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
    }

    .payment-holder {
      color: #aaa397;

      font-size: 12px;
      line-height: 1.7;
    }

    .small-button {
      margin-top: 14px;
      padding: 9px 12px;

      border: 1px solid #514a42;
      border-radius: 4px;

      background: transparent;
      color: #e7e1d6;

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .small-button:hover {
      background: #211c17;
    }

    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 6px;

      color: #746e66;

      font-size: 11px;
      line-height: 1.7;
    }

    #save-ticket-button {
      margin-top: 14px;
      padding: 10px 14px;

      border: 1px solid #514a42;
      border-radius: 4px;

      background: transparent;
      color: #e7e1d6;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    #save-ticket-button:hover {
      background: #211c17;
      border-color: #695f55;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 54px;
      padding-top: 18px;

      border-top: 1px solid #29251f;

      color: #575149;

      font-size: 10px;
      letter-spacing: 0.06em;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 480px) {

      .page {
        padding: 42px 8px 70px;
      }

      .ticket-header {
        gap: 14px;
        margin-bottom: 38px;
      }

      .poster-placeholder {
        width: 165px;
      }

      .header-text {
        flex: 1;
        min-width: 0;
        padding-top: 0;
      }

      .ticket-title {
        font-size:

            11vw,
            49px
          );

        line-height: 0.92;
        letter-spacing: -0.065em;
      }

      .ticket-description {
        margin-top: 16px;

        font-size:

            11px,
            2.9vw,
            12.5px
          );

        line-height: 1.6;
        letter-spacing: -0.02em;

        white-space: nowrap;

      /*
        상단과 정보 영역 모두

      */

      .ticket-top,
      .info-pair {

      }

      .ticket-top {

      }

      }

      .info-pair {

      }

      }

      /*
        6개 핵심 정보 모두 동일
      */

      .info-value {
        font-size:
          clamp(
            17px,
            4.5vw,

      }

      .date-main,

    /* =========================================================

    ========================================================= */

    @media (min-width: 769px) {

      .page {

      }

      .ticket-header {

      }

      .poster-placeholder {

        max-width: 300px;

      }

      .header-text {
        flex: 1;

      }

      .ticket-title {

        white-space: nowrap;
      }

      .ticket-description {

      }

      #loading {
        padding: 32px 0;
        font-size: 15px;
      }

      .ticket-top,
      .info-pair {
        grid-template-columns:
          minmax(0, 45fr)

        column-gap: 24px;
      }

      .ticket-top {
        padding: 36px 0 34px;
      }

      .ticket-label {
        margin-bottom: 11px;
        font-size: 13px;
      }

      #reservation-number {
        font-size: 42px;
      }

      #status {
        padding: 11px 17px;
        font-size: 15px;
      }

      .ticket-info {
        padding: 26px 0 28px;
      }

      .info-pair {
        padding: 16px 0;
      }

      .info-label {
        margin-bottom: 8px;
        font-size: 13px;
      }

      .info-value {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.28;
        letter-spacing: -0.05em;
      }

      .date-main,
      .date-time,
      .venue-name {
        font-size: inherit;
        font-weight: inherit;
        line-height: inherit;
        letter-spacing: inherit;
      }

      .venue-address {
        margin-top: 5px;
        font-size: 14px;
      }

      #payment-info {
        margin: 12px 0 32px;
        padding: 24px;
      }

      .payment-label {
        margin-bottom: 10px;
        font-size: 13px;
      }

      .payment-account {
        font-size: 18px;
      }

      .payment-holder {
        font-size: 14px;
      }

      .small-button {
        margin-top: 18px;
        padding: 11px 15px;
        font-size: 13px;
      }

      .notice {
        font-size: 13px;
        line-height: 1.8;
      }

      #save-ticket-button {
        margin-top: 18px;
        padding: 12px 17px;
        font-size: 14px;
      }

      .footer {
        margin-top: 66px;
        padding-top: 22px;
        font-size: 12px;
      }

    }

    ========================================================= */

    .page.capture-mode

    }

    /*

    */

    .page.capture-mode

    .page.capture-mode

<body>

  <main class="page">


    <header class="ticket-header">

      <img
        src="backintown1440.png"
        alt="BACK IN TOWN 포스터"
        class="poster-placeholder"
        loading="eager"
      >

      <div class="header-text">

        <h1 class="ticket-title">
          BACK<br>
          IN TOWN
        </h1>

        <p class="ticket-description">
          한국외국어대학교 중앙힙합동아리<br>
          HUFS DOVY 2026년 정기공연
        </p>

      </div>

    </header>



    <p id="loading">
      티켓 정보를 불러오는 중...

      <!-- =========================
           INFO
      ========================== -->

          <div class="info-item">

            <span class="info-label">
              일시
            </span>

            <strong class="info-value">

              <span class="date-main">
                2026년 11월 21일 (토)
              </span>

              <span class="date-time">
                오후 6:00
              </span>

          </div>



          <div class="info-item">

            <span class="info-label">

            </span>

            <strong class="info-value">

              <span class="venue-name">

              </span>

        <!-- 예매자 / 연락처 -->

          </div>

  </main>



  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>



  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec';



    async function loadTicket() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const token =
        params.get('token');


      if (!token) {

        document
          .getElementById('loading')
          .textContent =
          '유효하지 않은 티켓 주소입니다.';

        return;

      }


      try {

        const response =
          await fetch(
            API_URL
            + '?action=getReservation&token='
            + encodeURIComponent(token)
          );


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message
            ||
            '티켓을 찾을 수 없습니다.'
          );

        }


        const reservation =
          data.reservation;


        document
          .getElementById('reservation-number')
          .textContent =
          reservation.reservationNumber;


        document
          .getElementById('name')
          .textContent =
          reservation.name;


        document
          .getElementById('phone')
          .textContent =
          reservation.phone;


        document
          .getElementById('quantity')
          .textContent =
          reservation.quantity + '매';


        document
          .getElementById('total-price')
          .textContent =
          Number(reservation.totalPrice)
            .toLocaleString('ko-KR')
          + '원';


        const statusElement =
          document.getElementById('status');


        const currentStatus =
          String(
            reservation.status
          ).trim();


        statusElement.textContent =
          currentStatus;


        statusElement
          .classList
          .remove(
            'status-pending',
            'status-confirmed',
            'status-cancelled'
          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          statusElement
            .classList
            .add(
              'status-pending'
            );

        }


        if (
          currentStatus
          ===
          '예매 확정'
        ) {

          statusElement
            .classList
            .add(
              'status-confirmed'
            );

        }


        if (
          currentStatus
          ===
          '예매 취소'
        ) {

          statusElement
            .classList
            .add(
              'status-cancelled'
            );

        }


        const paymentInfo =
          document.getElementById(
            'payment-info'
          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          paymentInfo
            .style
            .display =
            'block';

        } else {

          paymentInfo
            .style
            .display =
            'none';

        }


        document
          .getElementById('loading')
          .style
          .display =
          'none';


        document
          .getElementById('ticket')
          .style
          .display =
          'block';


      } catch (error) {

        console.error(error);

        document
          .getElementById('loading')
          .textContent =
          '티켓 정보를 불러오지 못했습니다.';

      }

    }



    function copyAccount() {

      const accountNumber =
        '1002-7972-6507';


      navigator.clipboard

        .writeText(accountNumber)

        .then(() => {

          alert(
            '계좌번호가 복사되었습니다.'
          );

        })

        .catch(() => {

          alert(
            '계좌번호 복사에 실패했습니다.'
          );

        });

    }



    const saveTicketButton =
      document.getElementById(
        'save-ticket-button'
      );



    saveTicketButton
      .addEventListener(
        'click',
        async function () {

          const ticketPage =
            document.querySelector(
              '.page'
            );


          const notice =
            document.querySelector(
              '.notice'
            );


          try {

            saveTicketButton.disabled =
              true;


            saveTicketButton.textContent =
              '이미지 만드는 중...';


            ticketPage
              .classList
              .add(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              'none';


            if (notice) {

              notice
                .style
                .display =
                'none';

            }


            if (
              document.fonts
              &&
              document.fonts.ready
            ) {

              await document
                .fonts
                .ready;

            }


            await new Promise(
              resolve => {

                requestAnimationFrame(
                  () => {

                    requestAnimationFrame(
                      resolve
                    );

                  }
                );

              }
            );


            const captureHeight =
              Math.max(
                899,
                ticketPage.scrollHeight
              );


            const canvas =
              await html2canvas(
                ticketPage,
                {
                  backgroundColor:
                    '#12100e',

                  scale:
                    2,

                  useCORS:
                    true,

                  width:
                    520,

                  height:
                    captureHeight,

                  windowWidth:
                    520,

                  windowHeight:
                    captureHeight,

                  scrollX:
                    0,

                  scrollY:
                    0
                }
              );


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              '';


            if (notice) {

              notice
                .style
                .display =
                '';

            }


            const reservationNumber =
              document
                .getElementById(
                  'reservation-number'
                )
                .textContent
                .trim();


            const blob =
              await new Promise(
                resolve => {

                  canvas.toBlob(
                    resolve,
                    'image/png'
                  );

                }
              );


            if (!blob) {

              throw new Error(
                '이미지 생성 실패'
              );

            }


            const fileName =
              `BACK_IN_TOWN_${reservationNumber}.png`;


            const file =
              new File(
                [blob],
                fileName,
                {
                  type:
                    'image/png'
                }
              );


            if (
              navigator.canShare
              &&
              navigator.canShare({
                files: [file]
              })
            ) {

              await navigator.share({
                files: [file],
                title:
                  'BACK IN TOWN Ticket'
              });

            } else {

              const link =
                document.createElement(
                  'a'
                );


              link.download =
                fileName;


              link.href =
                canvas.toDataURL(
                  'image/png'
                );


              link.click();

            }


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


          } catch (error) {

            console.error(error);


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              '';


            if (notice) {

              notice
                .style
                .display =
                '';

            }


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


            alert(
              '티켓 이미지 저장에 실패했습니다.'
            );

          }

        }
      );



    loadTicket();

  </script>
