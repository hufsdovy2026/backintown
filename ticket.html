<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BACK IN TOWN Ticket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background: #ecebe7;
      color: #171513;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 560px;

      margin: 0 auto;

      padding:
        24px
        14px
        40px;
    }


    /* =========================
       OUTER TICKET
    ========================= */

    .ticket-shell {
      width: 100%;

      padding:
        20px
        18px
        18px;

      border:
        1px solid #d3d0ca;

      border-radius: 16px;

      background: #f9f8f5;

      box-shadow:
        0 12px 36px
        rgba(35, 31, 27, 0.07);
    }


    /* =========================
       HEADER
    ========================= */

    .ticket-header {
      display: flex;

      align-items: flex-start;

      gap: 18px;

      margin-bottom: 20px;
    }

    .poster-placeholder {
      width: 144px;

      aspect-ratio: 3 / 4;

      display: block;

      flex-shrink: 0;

      border: none;

      border-radius: 3px;

      object-fit: cover;

      box-shadow:
        0 10px 26px
        rgba(38, 32, 27, 0.14);
    }

    .header-text {
      flex: 1;

      min-width: 0;

      padding-top: 2px;
    }

    .ticket-title {
      margin: 0;

      color: #171513;

      font-size: 44px;
      font-weight: 900;

      line-height: 0.92;

      letter-spacing: -0.055em;
    }

    .ticket-description {
      margin:
        15px
        0
        0;

      color: #746e67;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.6;
    }


    /* =========================
       LOADING
    ========================= */

    #loading {
      margin: 0;

      padding:
        14px
        0;

      color: #746e67;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       TICKET
    ========================= */

    #ticket {
      border: none;
    }


    /* =========================
       COMMON AXIS
    ========================= */

    .ticket-top,
    .info-pair {
      display: grid;

      grid-template-columns:
        minmax(0, 54fr)
        minmax(0, 46fr);

      column-gap: 14px;

      width: 100%;
    }


    /* =========================
       SHARED INNER CARD STYLE
    ========================= */

    .ticket-top,
    .ticket-info {
      border:
        1px solid #d5d1cb;

      border-radius: 10px;

      background: #ffffff;
    }


    /* =========================
       RESERVATION CARD
    ========================= */

    .ticket-top {
      align-items: end;

      padding:
        16px
        17px;
    }

    .reservation-block {
      min-width: 0;
    }

    .status-block {
      min-width: 0;

      display: flex;

      align-items: flex-end;
      justify-content: flex-start;

      padding-bottom: 1px;
    }

    .ticket-label {
      display: block;

      margin-bottom: 7px;

      color: #9a3c38;

      font-size: 11px;
      font-weight: 800;

      line-height: 1.2;

      letter-spacing: 0.12em;
    }

    #reservation-number {
      display: block;

      color: #171513;

      font-size: 30px;
      font-weight: 800;

      line-height: 1.15;

      letter-spacing: -0.04em;

      white-space: nowrap;
    }


    /* =========================
       STATUS
    ========================= */

    #status {
      display: inline-flex;

      width: auto;

      align-items: center;
      justify-content: center;

      padding:
        8px
        13px;

      border:
        1px solid #bbb7b0;

      border-radius: 999px;

      background: #e8e5e0;

      color: #625d57;

      font-size: 12px;
      font-weight: 800;

      line-height: 1.2;

      white-space: nowrap;
    }

    #status.status-pending {
      border-color: #bbb7b0;

      background: #e8e5e0;

      color: #625d57;
    }

    #status.status-confirmed {
      border-color: #2f6fed;

      background: #2f6fed;

      color: #ffffff;
    }

    #status.status-cancelled {
      border-color: #c94845;

      background: #c94845;

      color: #ffffff;
    }


    /* =========================
       DETAIL CARD
    ========================= */

    .ticket-info {
      margin-top: 11px;

      padding:
        11px
        17px;
    }

    .info-pair {
      align-items: flex-start;

      padding:
        9px
        0;
    }

    .info-item {
      min-width: 0;

      text-align: left;
    }


    /* =========================
       INFO LABEL
    ========================= */

    .info-label {
      display: block;

      width: 100%;

      margin-bottom: 5px;

      color: #746e67;

      text-align: left;

      font-size: 10.5px;
      font-weight: 600;

      line-height: 1.2;
    }


    /* =========================
       INFO VALUE
    ========================= */

    .info-value {
      display: block;

      width: 100%;

      color: #171513;

      text-align: left;

      font-size: 19px;
      font-weight: 800;

      line-height: 1.24;

      letter-spacing: -0.025em;
    }

    .date-main {
      display: block;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: -0.06em;

      white-space: nowrap;
    }

    .date-time {
      display: block;

      margin-top: 2px;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: inherit;
    }

    .venue-name {
      display: block;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: inherit;

      white-space: nowrap;
    }

    .venue-address {
      display: block;

      margin-top: 3px;

      color: #746e67;

      text-align: left;

      font-size: 10.5px;
      font-weight: 500;

      line-height: 1.35;

      letter-spacing: -0.045em;

      white-space: nowrap;
    }


    /* =========================
       PAYMENT CARD
    ========================= */

    #payment-info {
      display: none;

      margin-top: 11px;

      padding:
        14px
        16px;

      border:
        1.5px solid #b84a4a;

      border-radius: 10px;

      background: #fff6f3;
    }

    .payment-label {
      margin-bottom: 6px;

      color: #9a3c38;

      font-size: 10.5px;
      font-weight: 800;
    }

    .payment-account {
      color: #171513;

      font-size: 14px;
      font-weight: 800;

      line-height: 1.6;
    }

    .payment-holder {
      color: #6d6560;

      font-size: 11px;

      line-height: 1.6;
    }

    .small-button {
      margin-top: 10px;

      padding:
        8px
        11px;

      border:
        1px solid #b84a4a;

      border-radius: 5px;

      background: transparent;

      color: #9a3c38;

      font-size: 10.5px;
      font-weight: 800;

      cursor: pointer;
    }

    .small-button:hover {
      background: #f5e6e2;
    }


    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin:
        11px
        1px
        0;

      color: #746e67;

      font-size: 10.5px;

      line-height: 1.6;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 18px;

      padding-top: 13px;

      border-top:
        1px solid #dedad4;

      color: #969089;

      font-size: 9.5px;

      letter-spacing: 0.07em;
    }


    /* =========================
       SAVE BUTTON
    ========================= */

    #save-ticket-button {
      display: none;

      margin-top: 14px;

      padding:
        11px
        15px;

      border:
        1px solid #99938c;

      border-radius: 6px;

      background: transparent;

      color: #211e1a;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    #save-ticket-button:hover {
      background: #e3e1dc;

      border-color: #6f6963;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 480px) {

      .page {
        padding:
          12px
          8px
          28px;
      }

      .ticket-shell {
        padding:
          16px
          12px
          14px;

        border-radius: 14px;
      }

      .ticket-header {
        gap: 13px;

        margin-bottom: 16px;
      }

      .poster-placeholder {
        width: 145px;
      }

      .header-text {
        padding-top: 0;
      }

      .ticket-title {
        font-size:
          clamp(
            40px,
            10.8vw,
            47px
          );

        line-height: 0.92;

        letter-spacing: -0.065em;
      }

      .ticket-description {
        margin-top: 13px;

        font-size:
          clamp(
            10.5px,
            2.8vw,
            12px
          );

        line-height: 1.55;

        letter-spacing: -0.02em;

        white-space: nowrap;
      }

      .ticket-top,
      .info-pair {
        grid-template-columns:
          minmax(0, 54fr)
          minmax(0, 46fr);

        column-gap: 11px;
      }

      .ticket-top {
        padding:
          14px
          14px;

        border-radius: 9px;
      }

      .ticket-label {
        margin-bottom: 6px;

        font-size: 10px;
      }

      #reservation-number {
        font-size: 27px;
      }

      #status {
        padding:
          7px
          11px;

        font-size: 11.5px;
      }

      .ticket-info {
        margin-top: 9px;

        padding:
          8px
          14px;

        border-radius: 9px;
      }

      .info-pair {
        padding:
          8px
          0;
      }

      .info-label {
        margin-bottom: 5px;

        font-size: 10px;
      }

      .info-value {
        font-size:
          clamp(
            17px,
            4.7vw,
            19px
          );

        line-height: 1.23;
      }

      .date-main {
        letter-spacing: -0.065em;
      }

      .venue-address {
        font-size:
          clamp(
            9px,
            2.5vw,
            10px
          );

        letter-spacing: -0.055em;
      }

      #payment-info {
        margin-top: 9px;

        padding:
          13px
          14px;

        border-radius: 9px;
      }

      .footer {
        margin-top: 15px;

        padding-top: 12px;
      }

      #save-ticket-button {
        margin-left: 4px;
      }

    }


    /* =========================================================
       DESKTOP
    ========================================================= */

    @media (min-width: 769px) {

      .page {
        width: 760px;

        max-width: 760px;

        padding:
          36px
          24px
          48px;
      }

      .ticket-shell {
        padding:
          28px
          26px
          22px;

        border-radius: 18px;
      }

      .ticket-header {
        gap: 28px;

        margin-bottom: 24px;
      }

      .poster-placeholder {
        width: 210px;
      }

      .ticket-title {
        font-size: 76px;

        line-height: 0.9;

        letter-spacing: -0.07em;
      }

      .ticket-description {
        margin-top: 22px;

        font-size: 16px;

        line-height: 1.65;
      }

      .ticket-top,
      .info-pair {
        grid-template-columns:
          minmax(0, 54fr)
          minmax(0, 46fr);

        column-gap: 24px;
      }

      .ticket-top {
        padding:
          20px
          22px;
      }

      .ticket-label {
        font-size: 12px;
      }

      #reservation-number {
        font-size: 38px;
      }

      #status {
        padding:
          10px
          16px;

        font-size: 14px;
      }

      .ticket-info {
        margin-top: 13px;

        padding:
          14px
          22px;
      }

      .info-pair {
        padding:
          12px
          0;
      }

      .info-label {
        margin-bottom: 6px;

        font-size: 12px;
      }

      .info-value {
        font-size: 23px;
      }

      .venue-address {
        font-size: 12.5px;
      }

      #payment-info {
        margin-top: 13px;

        padding:
          18px
          20px;
      }

      .payment-label {
        font-size: 12px;
      }

      .payment-account {
        font-size: 17px;
      }

      .payment-holder {
        font-size: 13px;
      }

      .notice {
        font-size: 12px;
      }

      .footer {
        margin-top: 21px;

        padding-top: 15px;

        font-size: 11px;
      }

      #save-ticket-button {
        margin-top: 16px;

        padding:
          12px
          17px;

        font-size: 13px;
      }

    }


    /* =========================================================
       IMAGE CAPTURE MODE
       540 × 720 = 정확한 3:4
    ========================================================= */

    .page.capture-mode {
      width: 540px !important;

      min-width: 540px !important;
      max-width: 540px !important;

      height: 720px !important;
      min-height: 720px !important;
      max-height: 720px !important;

      margin: 0 !important;

      padding:
        14px !important;

      background:
        #ecebe7 !important;

      overflow: hidden !important;
    }

    .page.capture-mode
    .ticket-shell {
      width: 100% !important;

      height: 692px !important;

      padding:
        17px
        17px
        14px !important;

      border:

      border-radius:
        16px !important;

      background:

      box-shadow:
        0 8px 24px
        rgba(35, 31, 27, 0.06) !important;
    }

    .page.capture-mode
    .ticket-header {
      gap:
        16px !important;

      margin-bottom:
        15px !important;
    }

    .page.capture-mode
    .poster-placeholder {
      width:
        145px !important;

      min-width:
        145px !important;

      max-width:
        145px !important;
    }

    .page.capture-mode
    .header-text {
      flex:
        1 !important;

      min-width:
        0 !important;

      padding-top:
        0 !important;
    }

    .page.capture-mode
    .ticket-title {
      margin:
        0 !important;

      font-size:

    }

    .page.capture-mode

    }

    .page.capture-mode

    }

    .page.capture-mode

    }

    .page.capture-mode

<body>


  <main class="page">


    <section class="ticket-shell">


      <header class="ticket-header">

        <img
          src="backintown1440.png"
          alt="BACK IN TOWN 포스터"
          class="poster-placeholder"
          loading="eager"
        >

        <div class="header-text">

          <h1 class="ticket-title">
            BACK<br>
            IN TOWN
          </h1>

          <p class="ticket-description">
            한국외국어대학교 중앙힙합동아리<br>
            HUFS DOVY 2026년 정기공연
          </p>

        </div>

      </header>


      <p id="loading">
        티켓 정보를 불러오는 중...
      </p>


      <section
        id="ticket"
        style="display: none;"
      >


        <div class="ticket-top">

          <div class="reservation-block">

            <span class="ticket-label">
              RESERVATION
            </span>

            <strong
              id="reservation-number"
            ></strong>

          </div>


          <div class="status-block">

            <strong
              id="status"
            ></strong>

          </div>

        </div>


        <div class="ticket-info">


          <div class="info-pair">

            <div class="info-item">

              <span class="info-label">
                일시
              </span>

              <strong class="info-value">

                <span class="date-main">
                  2026년 11월 21일 (토)
                </span>

                <span class="date-time">
                  오후 6:00
                </span>

              </strong>

            </div>


            <div class="info-item">

              <span class="info-label">
                장소
              </span>

              <strong class="info-value">

                <span class="venue-name">
                  예림당 아트홀
                </span>

                <span class="venue-address">
                  서울특별시 강남구 언주로 337
                </span>

              </strong>

            </div>

          </div>


          <div class="info-pair">

            <div class="info-item">

              <span class="info-label">
                예매자
              </span>

              <strong
                class="info-value"
                id="name"
              ></strong>

            </div>


            <div class="info-item">

              <span class="info-label">
                연락처
              </span>

              <strong
                class="info-value"
                id="phone"
              ></strong>

            </div>

          </div>


          <div class="info-pair">

            <div class="info-item">

              <span class="info-label">
                예매 매수
              </span>

              <strong
                class="info-value"
                id="quantity"
              ></strong>

            </div>


            <div class="info-item">

              <span class="info-label">
                결제 금액
              </span>

              <strong
                class="info-value"
                id="total-price"
              ></strong>

            </div>

          </div>


        </div>


        <div id="payment-info">

          <div class="payment-label">
            입금 계좌
          </div>

          <div class="payment-account">
            토스뱅크 1002-7972-6507
          </div>

          <div class="payment-holder">
            예금주 진성재
          </div>

          <button
            type="button"
            class="small-button"
            onclick="copyAccount()"
          >
            계좌번호 복사
          </button>

        </div>


        <p class="notice">
          입금 확인 후 예매 상태가 변경됩니다.<br>
          본 티켓 링크는 공연 당일까지 보관해 주세요.
        </p>


      </section>


      <footer class="footer">
        HUFS DOVY · BACK IN TOWN
      </footer>


    </section>


    <button
      type="button"
      id="save-ticket-button"
    >
      티켓 이미지 저장
    </button>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>


  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec';


    async function loadTicket() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const token =
        params.get('token');


      if (!token) {

        document
          .getElementById('loading')
          .textContent =
          '유효하지 않은 티켓 주소입니다.';

        return;

      }


      try {

        const response =
          await fetch(
            API_URL
            + '?action=getReservation&token='
            + encodeURIComponent(token)
          );

        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message
            ||
            '티켓을 찾을 수 없습니다.'
          );

        }


        const reservation =
          data.reservation;


        document
          .getElementById('reservation-number')
          .textContent =
          reservation.reservationNumber;


        document
          .getElementById('name')
          .textContent =
          reservation.name;


        document
          .getElementById('phone')
          .textContent =
          reservation.phone;


        document
          .getElementById('quantity')
          .textContent =
          reservation.quantity
          + '매';


        document
          .getElementById('total-price')
          .textContent =
          Number(
            reservation.totalPrice
          )
          .toLocaleString('ko-KR')
          + '원';


        const statusElement =
          document.getElementById(
            'status'
          );


        const currentStatus =
          String(
            reservation.status
          ).trim();


        statusElement.textContent =
          currentStatus;


        statusElement
          .classList
          .remove(
            'status-pending',
            'status-confirmed',
            'status-cancelled'
          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          statusElement
            .classList
            .add(
              'status-pending'
            );

        }


        if (
          currentStatus
          ===
          '예매 확정'
        ) {

          statusElement
            .classList
            .add(
              'status-confirmed'
            );

        }


        if (
          currentStatus
          ===
          '예매 취소'
        ) {

          statusElement
            .classList
            .add(
              'status-cancelled'
            );

        }


        const paymentInfo =
          document.getElementById(
            'payment-info'
          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          paymentInfo
            .style
            .display =
            'block';

        } else {

          paymentInfo
            .style
            .display =
            'none';

        }


        document
          .getElementById('loading')
          .style
          .display =
          'none';


        document
          .getElementById('ticket')
          .style
          .display =
          'block';


        document
          .getElementById(
            'save-ticket-button'
          )
          .style
          .display =
          'inline-flex';


      } catch (error) {

        console.error(error);


        document
          .getElementById('loading')
          .textContent =
          '티켓 정보를 불러오지 못했습니다.';

      }

    }


    function copyAccount() {

      const accountNumber =
        '1002-7972-6507';


      navigator.clipboard
        .writeText(
          accountNumber
        )
        .then(() => {

          alert(
            '계좌번호가 복사되었습니다.'
          );

        })
        .catch(() => {

          alert(
            '계좌번호 복사에 실패했습니다.'
          );

        });

    }


    const saveTicketButton =
      document.getElementById(
        'save-ticket-button'
      );


    saveTicketButton
      .addEventListener(
        'click',
        async function () {

          const ticketPage =
            document.querySelector(
              '.page'
            );


          try {

            saveTicketButton.disabled =
              true;


            saveTicketButton.textContent =
              '이미지 만드는 중...';


            ticketPage
              .classList
              .add(
                'capture-mode'
              );


            if (
              document.fonts
              &&
              document.fonts.ready
            ) {

              await document
                .fonts
                .ready;

            }


            await new Promise(
              resolve => {

                requestAnimationFrame(
                  () => {

                    requestAnimationFrame(
                      resolve
                    );

                  }
                );

              }
            );


            const canvas =
              await html2canvas(
                ticketPage,
                {
                  backgroundColor:
                    '#ecebe7',

                  scale:
                    2,

                  useCORS:
                    true,

                  width:
                    540,

                  height:
                    720,

                  windowWidth:
                    540,

                  windowHeight:
                    720,

                  scrollX:
                    0,

                  scrollY:
                    0
                }
              );


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            const reservationNumber =
              document
                .getElementById(
                  'reservation-number'
                )
                .textContent
                .trim();


            const blob =
              await new Promise(
                resolve => {

                  canvas.toBlob(
                    resolve,
                    'image/png'
                  );

                }
              );


            if (!blob) {

              throw new Error(
                '이미지 생성 실패'
              );

            }


            const fileName =
              `BACK_IN_TOWN_${reservationNumber}.png`;


            const file =
              new File(
                [blob],
                fileName,
                {
                  type:
                    'image/png'
                }
              );


            if (
              navigator.canShare
              &&
              navigator.canShare({
                files: [file]
              })
            ) {

              await navigator.share({
                files: [file],
                title:
                  'BACK IN TOWN Ticket'
              });

            }

            else {

              const link =
                document
                  .createElement(
                    'a'
                  );


              link.download =
                fileName;


              link.href =
                canvas
                  .toDataURL(
                    'image/png'
                  );


              link.click();

            }


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


          } catch (error) {

            console.error(error);


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


            alert(
              '티켓 이미지 저장에 실패했습니다.'
            );

          }

        }
      );


    loadTicket();

  </script>

</body>

</html>
