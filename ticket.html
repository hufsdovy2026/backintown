<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BACK IN TOWN Ticket</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;

      background: #111111;
      color: #f4f1eb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }



    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        54px
        22px
        70px;
    }



    /* =========================
       HEADER
    ========================= */

    .ticket-header {
      display: flex;

      align-items: flex-start;

      gap: 22px;

      margin-bottom: 42px;
    }


    .poster-placeholder {
      width: 145px;

      aspect-ratio: 2 / 3;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border:
        1px solid #393939;

      background: #181818;

      color: #55534f;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.1em;

      object-fit: cover;
    }


    .header-text {
      flex: 1;

      min-width: 0;

      padding-top: 2px;
    }


    .ticket-title {
      margin: 0;

      font-size: 44px;
      font-weight: 900;

      line-height: 0.92;

      letter-spacing: -0.055em;
    }


    .ticket-description {
      margin:
        18px
        0
        0;

      color: #a9a7a2;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.7;
    }



    /* =========================
       LOADING
    ========================= */

    #loading {
      padding:
        24px
        0;

      border-top:
        1px solid #393939;

      color: #8f8d88;

      font-size: 13px;

      line-height: 1.6;
    }



    /* =========================
       TICKET
    ========================= */

    #ticket {
      border-top:
        1px solid #393939;
    }


    .ticket-top {
      padding:
        28px
        0
        26px;

      border-bottom:
        1px solid #393939;
    }


    .ticket-label {
      margin-bottom: 9px;

      color: #777570;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.08em;
    }


    .reservation-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 16px;
    }


    #reservation-number {
      display: block;

      font-size: 32px;
      font-weight: 800;

      letter-spacing: -0.04em;
    }



    /* =========================
       STATUS
    ========================= */

    #status {
      display: inline-block;

      flex-shrink: 0;

      padding:
        10px
        14px;

      border:
        1px solid #444444;

      border-radius: 999px;

      background: #191919;

      color: #f4f1eb;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }


    #status.status-pending {
      border-color: #5a5a5a;

      background: #2a2a2a;

      color: #d8d8d8;
    }


    #status.status-confirmed {
      border-color: #2f6fed;

      background: #2f6fed;

      color: #ffffff;
    }


    #status.status-cancelled {
      border-color: #d64545;

      background: #d64545;

      color: #ffffff;
    }



    /* =========================
       INFO
    ========================= */

    .ticket-info {
      padding:
        24px
        0;

      border-bottom:
        1px solid #393939;
    }


    .info-row {
      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 20px;

      padding:
        11px
        0;
    }


    .info-label {
      flex-shrink: 0;

      color: #777570;

      font-size: 12px;
    }


    .info-value {
      color: #f4f1eb;

      text-align: right;

      font-size: 14px;
      font-weight: 600;

      line-height: 1.4;
    }


    .venue-address {
      color: #777570;

      font-size: 12px;
      font-weight: 500;
    }



    /* =========================
       PAYMENT
    ========================= */

    #payment-info {
      display: none;

      margin:
        6px
        0
        24px;

      padding: 18px;

      border:
        1px solid #393939;

      border-radius: 4px;

      background: #181818;
    }


    .payment-label {
      margin-bottom: 8px;

      color: #777570;

      font-size: 11px;
      font-weight: 600;
    }


    .payment-account {
      color: #f4f1eb;

      font-size: 14px;
      font-weight: 700;

      line-height: 1.7;
    }


    .payment-holder {
      color: #a9a7a2;

      font-size: 12px;

      line-height: 1.7;
    }


    .small-button {
      margin-top: 14px;

      padding:
        9px
        12px;

      border:
        1px solid #555555;

      border-radius: 4px;

      background: transparent;

      color: #f4f1eb;

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }



    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 6px;

      color: #74726e;

      font-size: 11px;

      line-height: 1.7;
    }


    #save-ticket-button {
      margin-top: 14px;

      padding:
        10px
        14px;

      border:
        1px solid #555555;

      border-radius: 4px;

      background: transparent;

      color: #f4f1eb;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }



    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 54px;

      padding-top: 18px;

      border-top:
        1px solid #272727;

      color: #55534f;

      font-size: 10px;

      letter-spacing: 0.06em;
    }



    /* =========================================================
       MOBILE
       현재 모바일 디자인 유지
    ========================================================= */

    @media (max-width: 480px) {

      .page {
        padding:
          42px
          12px
          70px;
      }


      .ticket-header {
        gap: 14px;

        margin-bottom: 38px;
      }


      .poster-placeholder {
        width: 165px;
      }


      .header-text {
        flex: 1;

        min-width: 0;

        padding-top: 0;
      }


      .ticket-title {
        font-size:
          clamp(
            42px,
            11vw,
            49px
          );

        line-height: 0.92;

        letter-spacing: -0.065em;
      }


      .ticket-description {
        margin-top: 16px;

        font-size:
          clamp(
            11px,
            2.9vw,
            12.5px
          );

        line-height: 1.6;

        letter-spacing: -0.02em;

        white-space: nowrap;
      }


      #reservation-number {
        font-size: 28px;
      }


      #status {
        padding:
          9px
          13px;

        font-size: 12px;
      }


      .info-label {
        font-size: 12px;
      }


      .info-value {
        font-size: 14px;
      }

    }



    /* =========================================================
       LAPTOP / DESKTOP
       모바일 티켓 비율 그대로 확대
    ========================================================= */

   /* =========================================================
   LAPTOP / DESKTOP
   모바일 티켓 구조를 유지하면서 가로폭 확대
========================================================= */

@media (min-width: 769px) {

  .page {
    width: 88vw;
    max-width: 1080px;

    margin: 0 auto;

    padding:
      60px
      36px
      90px;
  }


  .ticket-header {
    gap: 36px;
    margin-bottom: 54px;
  }


  .poster-placeholder {
    width: 32%;
    max-width: 300px;
    min-width: 240px;

    font-size: 13px;
  }


  .header-text {
    flex: 1;
    min-width: 0;

    padding-top: 4px;
  }


  .ticket-title {
    font-size: clamp(
      66px,
      6.2vw,
      94px
    );

    line-height: 0.9;

    letter-spacing: -0.065em;
  }


  .ticket-description {
    margin-top: 26px;

    font-size: clamp(
      15px,
      1.35vw,
      19px
    );

    line-height: 1.7;
  }


  #loading {
    padding:
      32px
      0;

    font-size: 15px;
  }


  .ticket-top {
    padding:
      36px
      0
      34px;
  }


  .ticket-label {
    margin-bottom: 12px;

    font-size: 13px;
  }


  #reservation-number {
    font-size: 42px;
  }


  #status {
    padding:
      12px
      18px;

    font-size: 15px;
  }


  .ticket-info {
    padding:
      32px
      0;
  }


  .info-row {
    gap: 28px;

    padding:
      15px
      0;
  }


  .info-label {
    font-size: 15px;
  }


  .info-value {
    font-size: 18px;

    line-height: 1.5;
  }


  .venue-address {
    font-size: 14px;
  }


  #payment-info {
    margin:
      12px
      0
      32px;

    padding: 24px;
  }


  .payment-label {
    margin-bottom: 10px;

    font-size: 13px;
  }


  .payment-account {
    font-size: 18px;
  }


  .payment-holder {
    font-size: 14px;
  }


  .small-button {
    margin-top: 18px;

    padding:
      11px
      15px;

    font-size: 13px;
  }


  .notice {
    font-size: 13px;

    line-height: 1.8;
  }


  #save-ticket-button {
    margin-top: 18px;

    padding:
      12px
      17px;

    font-size: 14px;
  }


  .footer {
    margin-top: 66px;

    padding-top: 22px;

    font-size: 12px;
  }

}

  </style>

</head>



<body>


  <main class="page">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="ticket-header">


      <!--
        실제 포스터 완성 후
        이 div를 img로 교체하면 됨.
      -->

      <div class="poster-placeholder">
        POSTER
      </div>


      <div class="header-text">


        <h1 class="ticket-title">

          BACK<br>

          IN TOWN

        </h1>


        <p class="ticket-description">

          한국외국어대학교 중앙힙합동아리<br>

          HUFS DOVY 2026년 정기공연

        </p>


      </div>


    </header>



    <!-- =========================
         LOADING
    ========================== -->

    <p id="loading">

      티켓 정보를 불러오는 중...

    </p>



    <!-- =========================
         TICKET
    ========================== -->

    <section
      id="ticket"
      style="display: none;"
    >



      <!-- 예약번호 / 상태 -->

      <div class="ticket-top">


        <div class="ticket-label">

          RESERVATION

        </div>



        <div class="reservation-row">


          <strong
            id="reservation-number"
          ></strong>


          <strong
            id="status"
          ></strong>


        </div>


      </div>



      <!-- =========================
           TICKET INFO
      ========================== -->

      <div class="ticket-info">



        <div class="info-row">


          <span class="info-label">

            일시

          </span>


          <strong class="info-value">

            2026년 11월 21일 (토) 오후 6:00

          </strong>


        </div>



        <div class="info-row">


          <span class="info-label">

            장소

          </span>


          <strong class="info-value">


            예림당 아트홀<br>


            <span class="venue-address">

              서울특별시 강남구 언주로 337

            </span>


          </strong>


        </div>



        <div class="info-row">


          <span class="info-label">

            예매자

          </span>


          <strong
            class="info-value"
            id="name"
          ></strong>


        </div>



        <div class="info-row">


          <span class="info-label">

            연락처

          </span>


          <strong
            class="info-value"
            id="phone"
          ></strong>


        </div>



        <div class="info-row">


          <span class="info-label">

            예매 매수

          </span>


          <strong
            class="info-value"
            id="quantity"
          ></strong>


        </div>



        <div class="info-row">


          <span class="info-label">

            결제 금액

          </span>


          <strong
            class="info-value"
            id="total-price"
          ></strong>


        </div>


      </div>



      <!-- =========================
           PAYMENT
      ========================== -->

      <div id="payment-info">


        <div class="payment-label">

          입금 계좌

        </div>


        <div class="payment-account">

          토스뱅크 1002-7972-6507

        </div>


        <div class="payment-holder">

          예금주 진성재

        </div>


        <button
          type="button"
          class="small-button"
          onclick="copyAccount()"
        >

          계좌번호 복사

        </button>


      </div>



      <!-- =========================
           NOTICE
      ========================== -->

      <p class="notice">

        입금 확인 후 예매 상태가 변경됩니다.<br>

        본 티켓 링크는 공연 당일까지 보관해 주세요.

      </p>



      <!-- =========================
           SAVE IMAGE
      ========================== -->

      <button
        type="button"
        id="save-ticket-button"
      >

        티켓 이미지 저장

      </button>


    </section>



    <footer class="footer">

      HUFS DOVY · BACK IN TOWN

    </footer>


  </main>



  <!-- =========================
       IMAGE LIBRARY
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>



  <script>


    const API_URL =
      'https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec';



    /* =========================
       TICKET LOAD
    ========================== */

    async function loadTicket() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      const token =
        params.get('token');



      if (!token) {


        document
          .getElementById(
            'loading'
          )
          .textContent =

          '유효하지 않은 티켓 주소입니다.';


        return;

      }



      try {


        const response =
          await fetch(

            API_URL

            + '?action=getReservation&token='

            + encodeURIComponent(
              token
            )

          );



        const data =
          await response.json();



        if (!data.success) {


          throw new Error(

            data.message

            ||

            '티켓을 찾을 수 없습니다.'

          );

        }



        const reservation =
          data.reservation;



        /* 예약번호 */

        document
          .getElementById(
            'reservation-number'
          )
          .textContent =

          reservation
            .reservationNumber;



        /* 예매자 */

        document
          .getElementById(
            'name'
          )
          .textContent =

          reservation.name;



        /* 연락처 */

        document
          .getElementById(
            'phone'
          )
          .textContent =

          reservation.phone;



        /* 매수 */

        document
          .getElementById(
            'quantity'
          )
          .textContent =

          reservation.quantity
          + '매';



        /* 결제금액 */

        document
          .getElementById(
            'total-price'
          )
          .textContent =


          Number(
            reservation.totalPrice
          )

          .toLocaleString(
            'ko-KR'
          )

          + '원';



        /* 상태 */

        const statusElement =
          document.getElementById(
            'status'
          );


        const currentStatus =
          String(
            reservation.status
          ).trim();



        statusElement.textContent =
          currentStatus;



        statusElement
          .classList
          .remove(

            'status-pending',

            'status-confirmed',

            'status-cancelled'

          );



        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {


          statusElement
            .classList
            .add(
              'status-pending'
            );

        }



        if (
          currentStatus
          ===
          '예매 확정'
        ) {


          statusElement
            .classList
            .add(
              'status-confirmed'
            );

        }



        if (
          currentStatus
          ===
          '예매 취소'
        ) {


          statusElement
            .classList
            .add(
              'status-cancelled'
            );

        }



        /* 입금 계좌 표시 */

        const paymentInfo =
          document.getElementById(
            'payment-info'
          );



        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {


          paymentInfo
            .style
            .display =
            'block';


        } else {


          paymentInfo
            .style
            .display =
            'none';

        }



        /* 로딩 종료 */

        document
          .getElementById(
            'loading'
          )
          .style
          .display =
          'none';



        document
          .getElementById(
            'ticket'
          )
          .style
          .display =
          'block';



      } catch (error) {


        console.error(
          error
        );


        document
          .getElementById(
            'loading'
          )
          .textContent =

          '티켓 정보를 불러오지 못했습니다.';


      }

    }



    /* =========================
       ACCOUNT COPY
    ========================== */

    function copyAccount() {


      const accountNumber =
        '1002-7972-6507';



      navigator.clipboard

        .writeText(
          accountNumber
        )

        .then(() => {


          alert(
            '계좌번호가 복사되었습니다.'
          );


        })

        .catch(() => {


          alert(
            '계좌번호 복사에 실패했습니다.'
          );


        });

    }



    /* =========================
       SAVE TICKET IMAGE
    ========================== */

    const saveTicketButton =
      document.getElementById(
        'save-ticket-button'
      );



    saveTicketButton
      .addEventListener(

        'click',

        async function () {


          const notice =
            document
              .querySelector(
                '.notice'
              );



          try {


            saveTicketButton
              .disabled =
              true;



            saveTicketButton
              .textContent =

              '이미지 만드는 중...';



            const ticketPage =
              document
                .querySelector(
                  '.page'
                );



            /*
              저장 이미지에서는
              안내문 / 저장 버튼 제외
            */

            saveTicketButton
              .style
              .display =
              'none';



            if (notice) {


              notice
                .style
                .display =
                'none';

            }



            const canvas =
              await html2canvas(

                ticketPage,

                {

                  backgroundColor:
                    '#111111',

                  scale: 2,

                  useCORS: true

                }

              );



            /*
              화면에서는 다시 표시
            */

            saveTicketButton
              .style
              .display =
              '';



            if (notice) {


              notice
                .style
                .display =
                '';

            }



            const reservationNumber =
              document

                .getElementById(
                  'reservation-number'
                )

                .textContent

                .trim();



            canvas.toBlob(


              async function (
                blob
              ) {


                if (!blob) {


                  throw new Error(
                    '이미지 생성 실패'
                  );

                }



                const fileName =

                  `BACK_IN_TOWN_${reservationNumber}.png`;



                const file =
                  new File(

                    [blob],

                    fileName,

                    {

                      type:
                        'image/png'

                    }

                  );



                /*
                  모바일:
                  공유 / 저장
                */

                if (

                  navigator.canShare

                  &&

                  navigator.canShare({

                    files: [file]

                  })

                ) {


                  await navigator
                    .share({

                      files:
                        [file],

                      title:
                        'BACK IN TOWN Ticket'

                    });


                }


                /*
                  PC:
                  PNG 다운로드
                */

                else {


                  const link =
                    document
                      .createElement(
                        'a'
                      );


                  link.download =
                    fileName;


                  link.href =
                    canvas
                      .toDataURL(
                        'image/png'
                      );


                  link.click();


                }



                saveTicketButton
                  .disabled =
                  false;


                saveTicketButton
                  .textContent =

                  '티켓 이미지 저장';


              },


              'image/png'


            );



          } catch (error) {


            console.error(
              error
            );


            saveTicketButton
              .style
              .display =
              '';



            if (notice) {


              notice
                .style
                .display =
                '';

            }



            saveTicketButton
              .disabled =
              false;


            saveTicketButton
              .textContent =

              '티켓 이미지 저장';



            alert(
              '티켓 이미지 저장에 실패했습니다.'
            );


          }


        }

      );



    /* =========================
       START
    ========================== */

    loadTicket();


  </script>


</body>

</html>
