<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BACK IN TOWN Ticket</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background: #f7f5f1;
      color: #171513;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 540px;

      margin: 0 auto;

      padding:
        42px
        20px
        44px;
    }


    /* =========================
       HEADER
    ========================= */

    .ticket-header {
      display: flex;

      align-items: flex-start;

      gap: 20px;

      margin-bottom: 28px;
    }

    .poster-placeholder {
      width: 148px;

      aspect-ratio: 3 / 4;

      display: block;

      flex-shrink: 0;

      border: none;

      object-fit: cover;

      box-shadow:
        0 12px 32px
        rgba(42, 35, 30, 0.16);
    }

    .header-text {
      flex: 1;

      min-width: 0;

      padding-top: 2px;
    }

    .ticket-title {
      margin: 0;

      color: #171513;

      font-size: 44px;
      font-weight: 900;

      line-height: 0.92;

      letter-spacing: -0.055em;
    }

    .ticket-description {
      margin:
        16px
        0
        0;

      color: #746e67;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.65;
    }


    /* =========================
       LOADING
    ========================= */

    #loading {
      padding:
        18px
        0;

      color: #746e67;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       TICKET
    ========================= */

    #ticket {
      border: none;
    }


    /* =========================
       COMMON AXIS
    ========================= */

    .ticket-top,
    .info-pair {
      display: grid;

      grid-template-columns:
        minmax(0, 54fr)
        minmax(0, 46fr);

      column-gap: 14px;

      width: 100%;
    }


    /* =========================
       RESERVATION TOP
    ========================= */

    .ticket-top {
      align-items: end;

      padding:
        12px
        0
        8px;

      border: none;
    }

    .reservation-block {
      min-width: 0;
    }

    .status-block {
      min-width: 0;

      display: flex;

      align-items: flex-end;
      justify-content: flex-start;

      padding-bottom: 1px;
    }

    .ticket-label {
      display: block;

      margin-bottom: 8px;

      color: #9a3c38;

      font-size: 11px;
      font-weight: 800;

      line-height: 1.2;

      letter-spacing: 0.12em;
    }

    #reservation-number {
      display: block;

      color: #171513;

      font-size: 32px;
      font-weight: 800;

      line-height: 1.2;

      letter-spacing: -0.04em;

      white-space: nowrap;
    }


    /* =========================
       STATUS
    ========================= */

    #status {
      display: inline-flex;

      width: auto;

      align-items: center;
      justify-content: center;

      padding:
        9px
        14px;

      border:
        1px solid #bcb7b0;

      border-radius: 999px;

      background: #e8e5e0;

      color: #625d57;

      font-size: 13px;
      font-weight: 800;

      line-height: 1.2;

      white-space: nowrap;
    }

    #status.status-pending {
      border-color: #bcb7b0;

      background: #e8e5e0;

      color: #625d57;
    }

    #status.status-confirmed {
      border-color: #2f6fed;

      background: #2f6fed;

      color: #ffffff;
    }

    #status.status-cancelled {
      border-color: #c94845;

      background: #c94845;

      color: #ffffff;
    }


    /* =========================
       INFO
    ========================= */

    .ticket-info {
      padding:
        6px
        0
        8px;

      border: none;
    }

    .info-pair {
      align-items: flex-start;

      padding:
        10px
        0;
    }

    .info-item {
      min-width: 0;

      text-align: left;
    }


    /* =========================
       LABEL
    ========================= */

    .info-label {
      display: block;

      width: 100%;

      margin-bottom: 6px;

      color: #746e67;

      text-align: left;

      font-size: 11px;
      font-weight: 600;

      line-height: 1.2;
    }


    /* =========================
       VALUES
    ========================= */

    .info-value {
      display: block;

      width: 100%;

      color: #171513;

      text-align: left;

      font-size: 21px;
      font-weight: 800;

      line-height: 1.26;

      letter-spacing: -0.025em;
    }

    .date-main {
      display: block;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: -0.06em;

      white-space: nowrap;
    }

    .date-time {
      display: block;

      margin-top: 2px;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: inherit;
    }

    .venue-name {
      display: block;

      font-size: inherit;
      font-weight: inherit;

      line-height: inherit;

      letter-spacing: inherit;

      white-space: nowrap;
    }

    .venue-address {
      display: block;

      margin-top: 3px;

      color: #746e67;

      text-align: left;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.35;

      letter-spacing: -0.035em;

      white-space: nowrap;
    }


    /* =========================
       PAYMENT
    ========================= */

    #payment-info {
      display: none;

      margin:
        10px
        0
        18px;

      padding: 16px;

      border:
        1.5px solid #b84a4a;

      border-radius: 6px;

      background: #fff6f3;
    }

    .payment-label {
      margin-bottom: 8px;

      color: #9a3c38;

      font-size: 11px;
      font-weight: 800;
    }

    .payment-account {
      color: #171513;

      font-size: 14px;
      font-weight: 800;

      line-height: 1.7;
    }

    .payment-holder {
      color: #6d6560;

      font-size: 12px;

      line-height: 1.7;
    }

    .small-button {
      margin-top: 12px;

      padding:
        9px
        12px;

      border:
        1px solid #b84a4a;

      border-radius: 4px;

      background: transparent;

      color: #9a3c38;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .small-button:hover {
      background: #f5e6e2;
    }


    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 2px;

      color: #746e67;

      font-size: 11px;

      line-height: 1.65;
    }

    #save-ticket-button {
      margin-top: 12px;

      padding:
        10px
        14px;

      border:
        1px solid #aaa49c;

      border-radius: 4px;

      background: transparent;

      color: #211e1a;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    #save-ticket-button:hover {
      background: #eeebe6;

      border-color: #77716a;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 26px;

      padding-top: 16px;

      border-top:
        1px solid #dedad4;

      color: #969089;

      font-size: 10px;

      letter-spacing: 0.06em;

      #loading {

      .ticket-top,

      .ticket-top {

      }

      .ticket-label {
        margin-bottom: 10px;

      }

      #reservation-number {
        font-size: 42px;
      }

      #status {
        padding:

      .ticket-info {

      .info-pair {

      .info-label {

      }

      .info-value {

      }

      .date-main {

      }

      .date-time,

      }

      .venue-address {

      }

      #payment-info {
        margin:
          12px
          0

        padding: 20px;
      }

      .payment-label {
        margin-bottom: 10px;

        font-size: 13px;
      }

      .payment-account {
        font-size: 18px;
      }

      .small-button {

<body>


  <main class="page">


    <header class="ticket-header">


      <img
        src="backintown1440.png"
        alt="BACK IN TOWN 포스터"
        class="poster-placeholder"
        loading="eager"
      >


      <div class="header-text">


        <h1 class="ticket-title">

          BACK<br>

          IN TOWN

        </h1>


        <p class="ticket-description">

          한국외국어대학교 중앙힙합동아리<br>

          HUFS DOVY 2026년 정기공연

        </p>


      </div>


    </header>



    <p id="loading">

      티켓 정보를 불러오는 중...

    </p>



    <section
      id="ticket"
      style="display: none;"
    >


      <div class="ticket-top">


        <div class="reservation-block">

          <span class="ticket-label">
            RESERVATION
          </span>

          <strong
            id="reservation-number"
          ></strong>

        </div>


        <div class="status-block">

          <strong
            id="status"
          ></strong>

        </div>


      </div>



      <div class="ticket-info">


        <div class="info-pair">


          <div class="info-item">

            <span class="info-label">
              일시
            </span>

            <strong class="info-value">

              <span class="date-main">
                2026년 11월 21일 (토)
              </span>

              <span class="date-time">
                오후 6:00
              </span>

            </strong>

          </div>


          <div class="info-item">

            <span class="info-label">
              장소
            </span>

            <strong class="info-value">

              <span class="venue-name">
                예림당 아트홀
              </span>

              <span class="venue-address">
                서울특별시 강남구 언주로 337
              </span>

            </strong>

          </div>


        </div>



        <div class="info-pair">


          <div class="info-item">

            <span class="info-label">
              예매자
            </span>

            <strong
              class="info-value"
              id="name"
            ></strong>

          </div>


          <div class="info-item">

            <span class="info-label">
              연락처
            </span>

            <strong
              class="info-value"
              id="phone"
            ></strong>

          </div>


        </div>



        <div class="info-pair">


          <div class="info-item">

            <span class="info-label">
              예매 매수
            </span>

            <strong
              class="info-value"
              id="quantity"
            ></strong>

          </div>


          <div class="info-item">

            <span class="info-label">
              결제 금액
            </span>

            <strong
              class="info-value"
              id="total-price"
            ></strong>

          </div>


        </div>


      </div>



      <div id="payment-info">


        <div class="payment-label">
          입금 계좌
        </div>


        <div class="payment-account">
          토스뱅크 1002-7972-6507
        </div>


        <div class="payment-holder">
          예금주 진성재
        </div>


        <button
          type="button"
          class="small-button"
          onclick="copyAccount()"
        >
          계좌번호 복사
        </button>


      </div>



      <p class="notice">

        입금 확인 후 예매 상태가 변경됩니다.<br>

        본 티켓 링크는 공연 당일까지 보관해 주세요.

      </p>



      <button
        type="button"
        id="save-ticket-button"
      >
        티켓 이미지 저장
      </button>


    </section>



    <footer class="footer">

      HUFS DOVY · BACK IN TOWN

    </footer>


  </main>



  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ></script>



  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec';



    async function loadTicket() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const token =
        params.get('token');


      if (!token) {

        document
          .getElementById(
            'loading'
          )
          .textContent =
          '유효하지 않은 티켓 주소입니다.';


        return;

      }


      try {

        const response =
          await fetch(

            API_URL

            + '?action=getReservation&token='

            + encodeURIComponent(
              token
            )

          );


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(

            data.message

            ||

            '티켓을 찾을 수 없습니다.'

          );

        }


        const reservation =
          data.reservation;


        document
          .getElementById(
            'reservation-number'
          )
          .textContent =
          reservation.reservationNumber;


        document
          .getElementById(
            'name'
          )
          .textContent =
          reservation.name;


        document
          .getElementById(
            'phone'
          )
          .textContent =
          reservation.phone;


        document
          .getElementById(
            'quantity'
          )
          .textContent =
          reservation.quantity
          + '매';


        document
          .getElementById(
            'total-price'
          )
          .textContent =

          Number(
            reservation.totalPrice
          )

          .toLocaleString(
            'ko-KR'
          )

          + '원';


        const statusElement =
          document.getElementById(
            'status'
          );


        const currentStatus =
          String(
            reservation.status
          ).trim();


        statusElement.textContent =
          currentStatus;


        statusElement
          .classList
          .remove(

            'status-pending',

            'status-confirmed',

            'status-cancelled'

          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          statusElement
            .classList
            .add(
              'status-pending'
            );

        }


        if (
          currentStatus
          ===
          '예매 확정'
        ) {

          statusElement
            .classList
            .add(
              'status-confirmed'
            );

        }


        if (
          currentStatus
          ===
          '예매 취소'
        ) {

          statusElement
            .classList
            .add(
              'status-cancelled'
            );

        }


        const paymentInfo =
          document.getElementById(
            'payment-info'
          );


        if (
          currentStatus
          ===
          '입금 확인 중'
        ) {

          paymentInfo
            .style
            .display =
            'block';

        } else {

          paymentInfo
            .style
            .display =
            'none';

        }


        document
          .getElementById(
            'loading'
          )
          .style
          .display =
          'none';


        document
          .getElementById(
            'ticket'
          )
          .style
          .display =
          'block';


      } catch (error) {

        console.error(
          error
        );


        document
          .getElementById(
            'loading'
          )
          .textContent =
          '티켓 정보를 불러오지 못했습니다.';

      }

    }



    function copyAccount() {

      const accountNumber =
        '1002-7972-6507';


      navigator.clipboard

        .writeText(
          accountNumber
        )

        .then(() => {

          alert(
            '계좌번호가 복사되었습니다.'
          );

        })

        .catch(() => {

          alert(
            '계좌번호 복사에 실패했습니다.'
          );

        });

    }



    const saveTicketButton =
      document.getElementById(
        'save-ticket-button'
      );



    saveTicketButton
      .addEventListener(

        'click',

        async function () {

          const ticketPage =
            document.querySelector(
              '.page'
            );


          const notice =
            document.querySelector(
              '.notice'
            );


          try {

            saveTicketButton.disabled =
              true;


            saveTicketButton.textContent =
              '이미지 만드는 중...';


            ticketPage
              .classList
              .add(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              'none';


            if (notice) {

              notice
                .style
                .display =
                'none';

            }


            if (
              document.fonts
              &&
              document.fonts.ready
            ) {

              await document
                .fonts
                .ready;

            }


            await new Promise(
              resolve => {

                requestAnimationFrame(
                  () => {

                    requestAnimationFrame(
                      resolve
                    );

                  }
                );

              }
            );


            const canvas =
              await html2canvas(

                ticketPage,

                {

                  backgroundColor:
                    '#f7f5f1',

                  scale:
                    2,

                  useCORS:
                    true,

                  width:
                    540,

                  height:
                    720,

                  windowWidth:
                    540,

                  windowHeight:
                    720,

                  scrollX:
                    0,

                  scrollY:
                    0

                }

              );


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              '';


            if (notice) {

              notice
                .style
                .display =
                '';

            }


            const reservationNumber =
              document
                .getElementById(
                  'reservation-number'
                )
                .textContent
                .trim();


            const blob =
              await new Promise(
                resolve => {

                  canvas.toBlob(

                    resolve,

                    'image/png'

                  );

                }
              );


            if (!blob) {

              throw new Error(
                '이미지 생성 실패'
              );

            }


            const fileName =
              `BACK_IN_TOWN_${reservationNumber}.png`;


            const file =
              new File(

                [blob],

                fileName,

                {

                  type:
                    'image/png'

                }

              );


            if (

              navigator.canShare

              &&

              navigator.canShare({

                files:
                  [file]

              })

            ) {

              await navigator.share({

                files:
                  [file],

                title:
                  'BACK IN TOWN Ticket'

              });

            }

            else {

              const link =
                document
                  .createElement(
                    'a'
                  );


              link.download =
                fileName;


              link.href =
                canvas
                  .toDataURL(
                    'image/png'
                  );


              link.click();

            }


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


          } catch (error) {

            console.error(
              error
            );


            ticketPage
              .classList
              .remove(
                'capture-mode'
              );


            saveTicketButton
              .style
              .display =
              '';


            if (notice) {

              notice
                .style
                .display =
                '';

            }


            saveTicketButton.disabled =
              false;


            saveTicketButton.textContent =
              '티켓 이미지 저장';


            alert(
              '티켓 이미지 저장에 실패했습니다.'
            );

          }

        }

      );



    loadTicket();

  </script>


</body>
