<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACK IN TOWN Ticket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      color: #f4f1eb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 54px 22px 70px;
    }


    /* =========================
       HEADER
    ========================= */

    .ticket-header {
      display: flex;
      align-items: flex-start;
      gap: 22px;

      margin-bottom: 42px;
    }

    .poster-placeholder {
      width: 145px;
      aspect-ratio: 2 / 3;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 1px solid #393939;
      background: #181818;
      color: #55534f;

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;

      object-fit: cover;
    }

    .header-text {
      padding-top: 2px;
      min-width: 0;
    }

    .ticket-title {
      margin: 0;

      font-size: 44px;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .ticket-description {
      margin: 18px 0 0;

      color: #a9a7a2;

      font-size: 12px;
      font-weight: 500;
      line-height: 1.7;
    }


    /* =========================
       LOADING
    ========================= */

    #loading {
      padding: 24px 0;

      border-top: 1px solid #393939;

      color: #8f8d88;

      font-size: 13px;
      line-height: 1.6;
    }


    /* =========================
       TICKET
    ========================= */

    #ticket {
      border-top: 1px solid #393939;
    }

    .ticket-top {
      padding: 28px 0 26px;

      border-bottom: 1px solid #393939;
    }

    .ticket-label {
      margin-bottom: 9px;

      color: #777570;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    #reservation-number {
      display: block;

      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }


    /* =========================
       TICKET INFO
    ========================= */

    .ticket-info {
      padding: 24px 0;

      border-bottom: 1px solid #393939;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      padding: 11px 0;
    }

    .info-label {
      color: #777570;

      font-size: 12px;
      flex-shrink: 0;
    }

    .info-value {
      color: #f4f1eb;

      text-align: right;

      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }


    /* =========================
       STATUS
    ========================= */

    .status-section {
      padding: 28px 0;
    }

    .status-title {
      margin-bottom: 13px;

      color: #777570;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    #status {
      display: inline-block;

      padding: 10px 14px;

      border: 1px solid #444444;
      border-radius: 999px;

      background: #191919;
      color: #f4f1eb;

      font-size: 13px;
      font-weight: 700;
    }
#status.status-pending {
  border-color: #5a5a5a;
  background: #2a2a2a;
  color: #d8d8d8;
}

#status.status-confirmed {
  border-color: #2f6fed;
  background: #2f6fed;
  color: #ffffff;
}

#status.status-cancelled {
  border-color: #d64545;
  background: #d64545;
  color: #ffffff;
}

    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 6px;

      color: #74726e;

      font-size: 11px;
      line-height: 1.7;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 54px;
      padding-top: 18px;

      border-top: 1px solid #272727;

      color: #55534f;

      font-size: 10px;
      letter-spacing: 0.06em;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .page {
        padding-top: 42px;
      }

      .ticket-header {
        gap: 16px;
        margin-bottom: 36px;
      }

      .poster-placeholder {
        width: 115px;
      }

      .ticket-title {
        font-size: 34px;
      }

      .ticket-description {
        margin-top: 14px;
        font-size: 11px;
      }

      #reservation-number {
        font-size: 28px;
      }

    }
  </style>
</head>


<body>

  <main class="page">

    <header class="ticket-header">

      <!--
        포스터가 완성되기 전 임시 영역
      -->
      <div class="poster-placeholder">
        POSTER
      </div>

      <div class="header-text">

        <h1 class="ticket-title">
          BACK<br>
          IN TOWN
        </h1>

        <p class="ticket-description">
          한국외국어대학교 중앙힙합동아리<br>
          HUFS DOVY 2026년 정기공연
        </p>

      </div>

    </header>


    <p id="loading">
      티켓 정보를 불러오는 중...
    </p>


    <section
      id="ticket"
      style="display: none;"
    >

  <div class="ticket-top">

  <div class="ticket-label">
    RESERVATION
  </div>

  <div style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  ">

    <strong id="reservation-number"></strong>

    <strong id="status"></strong>

  </div>

</div>


      <div class="ticket-info">

        <div class="info-row">
          <span class="info-label">
            일시
          </span>

          <strong class="info-value">
            2026년 11월 21일 (토) 오후 6:00
          </strong>
        </div>


        <div class="info-row">
          <span class="info-label">
            장소
          </span>

          <strong class="info-value">
            예림당 아트홀<br>

            <span style="
              color: #777570;
              font-size: 12px;
              font-weight: 500;
            ">
              서울특별시 강남구 언주로 337
            </span>
          </strong>
        </div>


        <div class="info-row">
          <span class="info-label">
            예매자
          </span>

          <strong
            class="info-value"
            id="name"
          ></strong>
        </div>


        <div class="info-row">
          <span class="info-label">
            연락처
          </span>

          <strong
            class="info-value"
            id="phone"
          ></strong>
        </div>


        <div class="info-row">
          <span class="info-label">
            예매 매수
          </span>

          <strong
            class="info-value"
            id="quantity"
          ></strong>
        </div>


        <div class="info-row">
          <span class="info-label">
            결제 금액
          </span>

          <strong
            class="info-value"
            id="total-price"
          ></strong>
        </div>

      </div>




<div
  id="payment-info"
  style="
    display: none;
    margin: 6px 0 24px;
    padding: 18px;
    border: 1px solid #393939;
    border-radius: 4px;
    background: #181818;
  "
>

  <div style="
    margin-bottom: 8px;
    color: #777570;
    font-size: 11px;
    font-weight: 600;
  ">
    입금 계좌
  </div>

  <div style="
    color: #f4f1eb;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.7;
  ">
    토스뱅크 1002-7972-6507
  </div>

  <div style="
    color: #a9a7a2;
    font-size: 12px;
    line-height: 1.7;
  ">
    예금주 진성재
  </div>
<button
  type="button"
  onclick="copyAccount()"
  style="
    margin-top: 14px;
    padding: 9px 12px;
    border: 1px solid #555555;
    border-radius: 4px;
    background: transparent;
    color: #f4f1eb;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  "
>
  계좌번호 복사
</button>
</div>
      <p class="notice">
  입금 확인 후 예매 상태가 변경됩니다.<br>
  본 티켓 링크는 공연 당일까지 보관해 주세요.
</p>
<button
  type="button"
  id="save-ticket-button"
  style="
    margin-top: 14px;
    padding: 10px 14px;
    border: 1px solid #555555;
    border-radius: 4px;
    background: transparent;
    color: #f4f1eb;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  "
>
  티켓 이미지 저장
</button>
    </section>


    <footer class="footer">
      HUFS DOVY · BACK IN TOWN
    </footer>

  </main>


  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec';


    async function loadTicket() {

      const params =
        new URLSearchParams(window.location.search);

      const token =
        params.get('token');


      if (!token) {

        document.getElementById('loading').textContent =
          '유효하지 않은 티켓 주소입니다.';

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            '?action=getReservation&token=' +
            encodeURIComponent(token)
          );


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message ||
            '티켓을 찾을 수 없습니다.'
          );

        }


        const reservation =
          data.reservation;


        document.getElementById(
          'reservation-number'
        ).textContent =
          reservation.reservationNumber;


        document.getElementById(
          'name'
        ).textContent =
          reservation.name;


        document.getElementById(
          'phone'
        ).textContent =
          reservation.phone;


        document.getElementById(
          'quantity'
        ).textContent =
          reservation.quantity + '매';


        document.getElementById(
          'total-price'
        ).textContent =
          Number(
            reservation.totalPrice
          ).toLocaleString('ko-KR') + '원';


        document.getElementById(
          'status'
        ).textContent =
          reservation.status;
        const statusElement =
  document.getElementById('status');

statusElement.classList.remove(
  'status-pending',
  'status-confirmed',
  'status-cancelled'
);

const currentStatus =
  String(reservation.status).trim();

if (currentStatus === '입금 확인 중') {
  statusElement.classList.add('status-pending');
}

if (currentStatus === '입금 확인') {
  statusElement.classList.add('status-confirmed');
}

if (currentStatus === '예매 취소') {
  statusElement.classList.add('status-cancelled');
}
const paymentInfo =
  document.getElementById('payment-info');

if (
  String(reservation.status).trim() ===
  '입금 확인 중'
) {
  paymentInfo.style.display = 'block';
} else {
  paymentInfo.style.display = 'none';
}

        document.getElementById(
          'loading'
        ).style.display =
          'none';


        document.getElementById(
          'ticket'
        ).style.display =
          'block';


      } catch (error) {

        document.getElementById(
          'loading'
        ).textContent =
          '티켓 정보를 불러오지 못했습니다.';

      }

    }

function copyAccount() {

  const accountNumber = '1002-7972-6507';

  navigator.clipboard
    .writeText(accountNumber)
    .then(() => {
      alert('계좌번호가 복사되었습니다.');
    })
    .catch(() => {
      alert('계좌번호 복사에 실패했습니다.');
    });

}
    loadTicket();

  </script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
