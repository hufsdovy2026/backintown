<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACK IN TOWN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      color: #f4f1eb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 54px 22px 70px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      margin-bottom: 44px;
    }

    .brand {
      margin: 0;

      font-size: clamp(42px, 12vw, 66px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 16px 0 0;

      color: #a9a7a2;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }


    /* =========================
       나중에 포스터 추가할 자리

       포스터가 나오면 아래 주석을 풀고
       이미지 파일 경로만 지정하면 됨.
    ========================= */

    /*
    .poster {
      width: 100%;
      margin-bottom: 38px;
      border-radius: 4px;
      display: block;
    }
    */


    /* =========================
       INFO
    ========================= */

    .event-info {
      padding: 22px 0;

      border-top: 1px solid #393939;
      border-bottom: 1px solid #393939;

      margin-bottom: 42px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 10px;

      font-size: 13px;
      line-height: 1.5;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #777570;
    }

    .info-value {
      color: #f4f1eb;
      text-align: right;
      font-weight: 500;
    }


    /* =========================
       FORM
    ========================= */

    .section-title {
      margin: 0 0 28px;

      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .field {
      margin-bottom: 25px;
    }

    .field label {
      display: block;

      margin-bottom: 9px;

      color: #b9b6b0;

      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 51px;

      padding: 0 14px;

      border: 1px solid #3b3b3b;
      border-radius: 3px;

      outline: none;

      background: #181818;
      color: #f4f1eb;

      font-size: 16px;

      transition:
        border-color 0.15s ease,
        background-color 0.15s ease;
    }

    input::placeholder {
      color: #5f5f5f;
    }

    input:focus {
      border-color: #efede7;
      background: #1c1c1c;
    }


    /* number input 화살표 정리 */

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }


    /* =========================
       PRICE
    ========================= */

    .price-box {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-top: 38px;
      margin-bottom: 28px;

      padding-top: 20px;

      border-top: 1px solid #393939;
    }

    .price-label {
      color: #8f8d88;

      font-size: 12px;
    }

    #total-price {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }


    /* =========================
       BUTTON
    ========================= */

    .submit-button {
      width: 100%;
      height: 56px;

      border: none;
      border-radius: 3px;

      background: #f1eee7;
      color: #111111;

      cursor: pointer;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;

      transition:
        transform 0.08s ease,
        opacity 0.15s ease;
    }

    .submit-button:hover {
      opacity: 0.9;
    }

    .submit-button:active {
      transform: scale(0.99);
    }


    /* =========================
       NOTICE
    ========================= */

    .notice {
      margin-top: 20px;

      color: #74726e;

      font-size: 11px;
      line-height: 1.65;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 58px;
      padding-top: 18px;

      border-top: 1px solid #272727;

      color: #55534f;

      font-size: 10px;
      letter-spacing: 0.06em;
    }


    @media (max-width: 480px) {

      .page {
        padding-top: 42px;
      }

      .header {
        margin-bottom: 36px;
      }

    }
  </style>
</head>


<body>

  <main class="page">

    <header class="header">
      <h1 class="brand">
        BACK<br>
        IN TOWN
      </h1>

      <p class="subtitle">
        2026 HUFS DOVY 정기공연 · 사전예매
      </p>
    </header>


    <!--
      포스터가 나오면 여기에 추가

      <img
        src="poster.jpg"
        alt="BACK IN TOWN 공연 포스터"
        class="poster"
      >
    -->


    <section class="event-info">

  <div class="info-row">
    <span class="info-label">일시</span>
    <span class="info-value">
      2026년 11월 21일 (토) 오후 6:00
    </span>
  </div>

  <div class="info-row">
    <span class="info-label">장소</span>
    <span class="info-value">
      예림당 아트홀<br>
      <span style="color:#777570; font-size:12px;">
        서울특별시 강남구 언주로 337
      </span>
    </span>
  </div>

  <div class="info-row">
    <span class="info-label">티켓</span>
    <span class="info-value">
      사전예매 7,000원<br>
      <span style="color:#a9a7a2; font-size:12px;">
        현장예매 10,000원
      </span>
    </span>
  </div>

</section>


    <section>

      <h2 class="section-title">
        사전예매
      </h2>


      <form
        action="https://script.google.com/macros/s/AKfycbz2gv1DUwDrpzkgV9UeRPZ4STgenRMLA5EFEJH6F6menoiAhsoYB0nfLhQOf5K_5duEFw/exec"
        method="POST"
      >

        <input
          type="hidden"
          name="action"
          value="createReservation"
        >


        <div class="field">
          <label for="name">
            예매자명
          </label>

          <input
            id="name"
            type="text"
            name="name"
            autocomplete="name"
            required
            maxlength="50"
          >
        </div>


        <div class="field">
          <label for="phone">
            연락처
          </label>

          <input
            id="phone"
            type="tel"
            name="phone"
            placeholder="010-1234-5678"
            autocomplete="tel"
            required
          >
        </div>


        <div class="field">
          <label for="depositorName">
            입금자명
          </label>

          <input
            id="depositorName"
            type="text"
            name="depositorName"
            required
            maxlength="50"
          >
        </div>


        <div class="field">
          <label for="quantity">
            예매 매수
          </label>

          <input
            id="quantity"
            type="number"
            name="quantity"
            value="1"
            min="1"
            step="1"
            required
          >
        </div>


        <div class="price-box">

          <span class="price-label">
            결제 예정 금액
          </span>

          <strong id="total-price">
            7,000원
          </strong>

        </div>

<div style="
  margin-bottom: 28px;
  padding: 18px;
  border: 1px solid #393939;
  border-radius: 3px;
  background: #181818;
">

  <div style="
    margin-bottom: 12px;
    color: #777570;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
  ">
    입금 계좌
  </div>

  <div style="
    color: #f4f1eb;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.7;
  ">
    토스뱅크 1002-7972-6507
  </div>

  <div style="
    color: #a9a7a2;
    font-size: 12px;
    line-height: 1.7;
  ">
    예금주 진성재
  </div>

</div>
        <button
          class="submit-button"
          type="submit"
        >
          예매 신청
        </button>


        <p class="notice">
          예매 신청 후 안내되는 티켓 페이지를 확인해 주세요.<br>
          입금 확인 후 티켓의 예매 상태가 변경됩니다.
        </p>

      </form>

    </section>


    <footer class="footer">
      HUFS DOVY · BACK IN TOWN
    </footer>

  </main>


  <script>

    const UNIT_PRICE = 7000;

    const quantityInput =
      document.getElementById('quantity');

    const totalPriceElement =
      document.getElementById('total-price');


    function updateTotalPrice() {

      const quantity =
        Number(quantityInput.value) || 0;

      const total =
        UNIT_PRICE * quantity;

      totalPriceElement.textContent =
        total.toLocaleString('ko-KR') + '원';

    }


    quantityInput.addEventListener(
      'input',
      updateTotalPrice
    );

  </script>

</body>
</html>
