<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACK IN TOWN</title>
</head>

<body>

  <h1>BACK IN TOWN</h1>
  <p>2026 HUFS DOVY 정기공연 사전예매</p>

  <hr>

  <form
  action="기존 Apps Script 주소"
  method="POST"
  target="reservationFrame"
>

    <input
      type="hidden"
      name="action"
      value="createReservation"
    >


    <p>
      <label>
        예매자명<br>
        <input
          type="text"
          name="name"
          required
          maxlength="50"
        >
      </label>
    </p>


    <p>
      <label>
        연락처<br>
        <input
          type="tel"
          name="phone"
          placeholder="010-1234-5678"
          required
        >
      </label>
    </p>


    <p>
      <label>
        입금자명<br>
        <input
          type="text"
          name="depositorName"
          required
          maxlength="50"
        >
      </label>
    </p>


    <p>
      <label>
        예매 매수<br>
        <input
          id="quantity"
          type="number"
          name="quantity"
          value="1"
          min="1"
          step="1"
          required
        >
      </label>
    </p>


    <p>
      결제 예정 금액:
      <strong id="total-price">7,000원</strong>
    </p>


    <button type="submit">
      예매 신청
    </button>

  </form>
  <iframe
  name="reservationFrame"
  id="reservationFrame"
  style="display: none;"
></iframe>


  <script>
    const UNIT_PRICE = 7000;

    const quantityInput =
      document.getElementById('quantity');

    const totalPriceElement =
      document.getElementById('total-price');


    function updateTotalPrice() {
      const quantity =
        Number(quantityInput.value) || 0;

      const total =
        UNIT_PRICE * quantity;

      totalPriceElement.textContent =
        total.toLocaleString('ko-KR') + '원';
    }


    quantityInput.addEventListener(
      'input',
      updateTotalPrice
    );
    window.addEventListener('message', function(event) {
  const reservationFrame =
    document.getElementById('reservationFrame');

  if (event.source !== reservationFrame.contentWindow) {
    return;
  }

  if (
    event.data &&
    event.data.type ===
      'BACK_IN_TOWN_RESERVATION_SUCCESS'
  ) {
    const token = String(event.data.token || '');

    if (!/^[a-f0-9]{32}$/i.test(token)) {
      return;
    }

    window.location.href =
      'ticket.html?token=' +
      encodeURIComponent(token);
  }
});
  </script>

</body>
</html>
